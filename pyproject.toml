[project]
name = "dspy-wity"
version = "0.2.0"
description = "DSPy integration for Wity, the typed-decision API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["wity", "dspy", "typed-decisions", "classification", "optimization"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "dspy>=3.4.0,<4",
    "wity-sdk>=0.2.0,<0.3",
]

[project.urls]
Homepage = "https://wity.alphanimble.com"
Documentation = "https://wity.alphanimble.com/docs/api"
Repository = "https://github.com/info-alphanimble/dspy-wity"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspy_wity"]

[tool.ruff]
line-length = 120
target-version = "py310"
# README examples keep hand-aligned comments.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

# DSPy ships no type hints.
[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true

# Signatures use DSPy's own style (`team: Choice[...] = dspy.OutputField()`), which mypy can't read.
[[tool.mypy.overrides]]
module = ["tests.*", "examples.*", "quick_start", "tuning", "metric"]
disable_error_code = ["valid-type", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No network in tests. Live tests turn it back on for themselves.
addopts = "--disable-socket --allow-unix-socket"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]
